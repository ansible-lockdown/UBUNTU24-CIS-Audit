---

{{ if or (and (eq .Vars.system_type "Server") .Vars.ubtu24cis_level_1) (and (eq .Vars.system_type "Workstation") .Vars.ubtu24cis_level_2) }}
  {{ if .Vars.ubtu24cis_rule_3_1_3 }}
    {{ if not .Vars.ubtu24cis_bluetooth_mask }}
package:
  bluetooth_pkg:
    title: 3.1.3 | Ensure bluetooth services are not in use | pkg removed
    skip: {{ .Vars.ubtu24cis_bluetooth_service }}
    skip-reason: bluetooth is required, ubtu24cis_bluetooth_service is true
    name: bluez
    installed: false
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 3.1.3
      NIST800-53R5: CM-7
    {{ end }}
    {{ if .Vars.ubtu24cis_bluetooth_mask }}
service:
  bluetooth_service_masked:
    title: 3.1.3 | Ensure bluetooth services are not in use | masked
    skip: {{ .Vars.ubtu24cis_bluetooth_service }}
    skip-reason: bluetooth is required, ubtu24cis_bluetooth_service is true
    name: bluetooth.service
    masked: true
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 3.1.3
      NIST800-53R5: CM-7
    {{ end }}
  {{ end }}
{{ end }}
