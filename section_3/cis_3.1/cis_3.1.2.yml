---

{{ if and (eq .Vars.system_type "Server") .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_3_1_2 }}
matching:
  wireless_disabled:
    title: 3.1.2 | Ensure wireless interfaces are not available
    content: {{ len (glob "/sys/class/net/*/wireless") }}
    matches: 0
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 3.1.2
      NIST800-53R5:
      - CM-7
  {{ end }}
{{ end }}
