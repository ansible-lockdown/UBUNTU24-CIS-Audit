---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_3_2_6 }}
command:
  modprobe_TIPC:
    title: 3.2.6 | Ensure tipc kernel module is not available | tipc config
    exec: modprobe --showconfig | grep -P '\b(install|blacklist)\h+tipc\b'
    exit-status: 0
    stdout:
    - '/^blacklist tipc$/'
    - '/^install tipc \/bin\/(true|false)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.6
      NIST800-53R5:
      - CM-7
      - SI-4
file:
  sys_module_tipc:
    title: 3.2.6 | Ensure tipc kernel module is not available | running tipc
    path: /sys/module/tipc
    exists: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.6
      NIST800-53R5:
      - CM-7
      - SI-4
  {{ end }}
{{ end }}
