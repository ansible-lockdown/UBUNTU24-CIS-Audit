---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_3_2_3 }}
command:
  modprobe_dccp:
    title: 3.2.3 | Ensure dccp kernel module is not available | DCCP config
    exec: modprobe --showconfig | grep -P '\b(install|blacklist)\h+dccp\b'
    exit-status: 0
    stdout:
    - '/^blacklist dccp$/'
    - '/^install dccp \/bin\/(true|false)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.3
      NIST800-53R5:
      - CM-7
      - SI-4
file:
  sys_module_dccp:
    title: 3.2.3 | Ensure dccp kernel module is not available | running dccp
    path: /sys/module/dccp
    exists: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.3
      NIST800-53R5:
      - CM-7
      - SI-4
  {{ end }}
{{ end }}
