---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_3_2_4 }}
command:
  modprobe_RDS:
    title: 3.2.4 | Ensure rds kernel module is not available | rds config
    exec: modprobe --showconfig | grep -P '\b(install|blacklist)\h+rds\b'
    exit-status: 0
    stdout:
    - '/^blacklist rds$/'
    - '/^install rds \/bin\/(true|false)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.4
      NIST800-53R5:
      - CM-7
      - SI-4
file:
  sys_module_rds:
    title: 3.2.4 | Ensure rds kernel module is not available | running rds
    path: /sys/module/rds
    exists: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.4
      NIST800-53R5:
      - CM-7
      - SI-4
  {{ end }}
{{ end }}
