---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_3_2_1 }}
command:
  modprobe_atm:
    title: 3.2.1 | Ensure atm kernel module is not available | atm config
    exit-status:
      or:
      - 0
      - 1
    exec: 'modprobe -n -v atm'
    stdout:
      - '/install /bin/(true|false)/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 3.2.1
      NIST800-53R5:
      - CM-7
      - SI-4
  lsmod_atm:
    title: 3.2.1 | Ensure atm kernel module is not available | running atm
    exit-status: 1
    exec: lsmod | grep -i atm
    stdout:
    - '!/^.*/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 3.2.1
      NIST800-53R5:
      - CM-7
      - SI-4
  {{ end }}
{{ end }}
