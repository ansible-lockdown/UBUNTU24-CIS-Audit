---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_3_2_1 }}
command:
  modprobe_atm:
    title: 3.2.1 | Ensure atm kernel module is not available | atm config
    exec: modprobe --showconfig | grep -P '\b(install|blacklist)\h+atm\b'
    exit-status: 0
    stdout:
    - '/^blacklist atm$/'
    - '/^install atm \/bin\/(true|false)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.1
      NIST800-53R5:
      - CM-7
      - SI-4
file:
  sys_module_atm:
    title: 3.2.1 | Ensure atm kernel module is not available | running atm
    path: /sys/module/atm
    exists: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.1
      NIST800-53R5:
      - CM-7
      - SI-4
  {{ end }}
{{ end }}
