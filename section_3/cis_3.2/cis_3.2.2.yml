---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_3_2_2 }}
command:
  modprobe_can:
    title: 3.2.2 | Ensure can kernel module is not available | can config
    exit-status:
      or:
      - 0
      - 1
    exec: 'modprobe -n -v can'
    stdout:
      - '/install /bin/(true|false)/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 3.2.2
      NIST800-53R5:
      - CM-7
      - SI-4
  lsmod_can:
    title: 3.2.2 | Ensure can kernel module is not available | running can
    exit-status: 1
    exec: lsmod | grep -i can
    stdout:
    - '!/^.*/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 3.2.2
      NIST800-53R5:
      - CM-7
      - SI-4
  {{ end }}
{{ end }}
