---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_3_2_2 }}
command:
  modprobe_can:
    title: 3.2.2 | Ensure can kernel module is not available | can config
    exec: modprobe --showconfig | grep -P '\b(install|blacklist)\h+can\b'
    exit-status: 0
    stdout:
    - '/^blacklist can$/'
    - '/^install can \/bin\/(true|false)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.2
      NIST800-53R5:
      - CM-7
      - SI-4
file:
  sys_module_can:
    title: 3.2.2 | Ensure can kernel module is not available | running can
    path: /sys/module/can
    exists: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.2
      NIST800-53R5:
      - CM-7
      - SI-4
  {{ end }}
{{ end }}
