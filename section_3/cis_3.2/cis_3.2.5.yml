{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_3_2_5 }}
command:
  modprobe_sctp:
    title: 3.2.5 | Ensure sctp kernel module is not available | sctp config
    exec: modprobe --showconfig | grep -P '\b(install|blacklist)\h+sctp\b'
    exit-status: 0
    stdout:
    - '/^blacklist sctp$/'
    - '/^install sctp \/bin\/(true|false)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.5
      NIST800-53R5:
      - CM-7
      - SI-4
file:
  sys_module_sctp:
    title: 3.2.5 | Ensure sctp kernel module is not available | running sctp
    path: /sys/module/sctp
    exists: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.5
      NIST800-53R5:
      - CM-7
      - SI-4
  {{ end }}
{{ end }}
