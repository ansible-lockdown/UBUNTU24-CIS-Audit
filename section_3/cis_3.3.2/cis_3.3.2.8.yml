---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_ipv6_required }}
    {{ if .Vars.ubtu24cis_rule_3_3_2_8 }}
      kernel-param:
        net.ipv6.conf.default.accept_ra:
          title: 3.3.2.8 | Ensure net.ipv6.conf.default.accept_ra is configured
          value: '0'
          meta:
            server: 1
            workstation: 1
            CIS_ID:
            - 3.3.2.8
            NIST800-53R5:
            - CM-1
            - CM-2
            - CM-6
            - CM-7
            - IA-5
      command:
        ipv6_def_accept_ra:
          title: 3.3.2.8 | Ensure net.ipv6.conf.default.accept_ra is configured | conf
          exec: |
            { /usr/lib/systemd/systemd-sysctl --cat-config; f=$(awk -F= '/^\s*IPT_SYSCTL=/{print $2}' /etc/default/ufw 2>/dev/null); [ -f "$f" ] && cat "$f"; } | grep -Pi '^\h*net(\.|/)ipv6(\.|/)conf(\.|/)default(\.|/)accept_ra\h*=' | tail -n 1
          exit-status: 0
          stdout:
          - '/=\s*0\s*$/'
          meta:
            server: 1
            workstation: 1
            CIS_ID:
            - 3.3.2.8
            NIST800-53R5:
            - CM-1
            - CM-2
            - CM-6
            - CM-7
            - IA-5
      {{ end }}
    {{ end }}
{{ end }}
