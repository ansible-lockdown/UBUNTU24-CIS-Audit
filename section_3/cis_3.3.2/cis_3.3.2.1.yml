---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_ipv6_required }}
    {{ if not .Vars.ubtu24cis_is_router }}
      {{ if .Vars.ubtu24cis_rule_3_3_2_1 }}
        kernel-param:
          net.ipv6.conf.all.forwarding:
            title: 3.3.2.1 | Ensure net.ipv6.conf.all.forwarding is configured
            value: '0'
            meta:
              server: 1
              workstation: 1
              CIS_ID:
              - 3.3.2.1
              NIST800-53R5:
              - CM-1
              - CM-2
              - CM-6
              - CM-7
              - IA-5
        command:
          ipv6_all_forwarding:
            title: 3.3.2.1 | Ensure net.ipv6.conf.all.forwarding is configured | conf
            exec: grep "net\.ipv6\.conf\.all\.forwarding" /etc/sysctl.conf /etc/sysctl.d/*
            exit-status:
              or:
              - 0
              - 1
            stdout:
            - '/net\.ipv6\.conf\.all\.forwarding\s*=\s*0/'
            meta:
              server: 1
              workstation: 1
              CIS_ID:
              - 3.3.2.1
              NIST800-53R5:
              - CM-1
              - CM-2
              - CM-6
              - CM-7
              - IA-5
        {{ end }}
      {{ end }}
    {{ end }}
{{ end }}
