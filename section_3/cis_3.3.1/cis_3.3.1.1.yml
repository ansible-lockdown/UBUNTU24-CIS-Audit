---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if not .Vars.ubtu24cis_is_router }}
    {{ if .Vars.ubtu24cis_rule_3_3_1_1 }}
      kernel-param:
        net.ipv4.ip_forward:
          title: 3.3.1.1 | Ensure net.ipv4.ip_forward is configured
          value: '0'
          meta:
            server: 1
            workstation: 1
            CIS_ID:
            - 3.3.1.1
            NIST800-53R5:
            - CM-1
            - CM-2
            - CM-6
            - CM-7
            - IA-5
      command:
        ipv4_ip_forward:
          title: 3.3.1.1 | Ensure net.ipv4.ip_forward is configured | conf
          exec: grep "net\.ipv4\.ip_forward" /etc/sysctl.conf /etc/sysctl.d/*
          exit-status:
            or:
            - 0
            - 1
          stdout:
          - '/net\.ipv4\.ip_forward\s*=\s*0/'
          meta:
            server: 1
            workstation: 1
            CIS_ID:
            - 3.3.1.1
            NIST800-53R5:
            - CM-1
            - CM-2
            - CM-6
            - CM-7
            - IA-5
      {{ end }}
    {{ end }}
{{ end }}
