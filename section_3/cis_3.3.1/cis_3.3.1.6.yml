---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_3_3_1_6 }}
    kernel-param:
      net.ipv4.icmp_ignore_bogus_error_responses:
        title: 3.3.1.6 | Ensure net.ipv4.icmp_ignore_bogus_error_responses is configured
        value: '1'
        meta:
          server: 1
          workstation: 1
          CIS_ID:
          - 3.3.1.6
          NIST800-53R5:
          - CM-1
          - CM-2
          - CM-6
          - CM-7
          - IA-5
    command:
      ipv4_ignore_bogus:
        title: 3.3.1.6 | Ensure net.ipv4.icmp_ignore_bogus_error_responses is configured | conf
        exec: grep "net\.ipv4\.icmp_ignore_bogus_error_responses" /etc/sysctl.conf /etc/sysctl.d/*
        exit-status:
          or:
          - 0
          - 1
        stdout:
        - '/net\.ipv4\.icmp_ignore_bogus_error_responses\s*=\s*1/'
        meta:
          server: 1
          workstation: 1
          CIS_ID:
          - 3.3.1.6
          NIST800-53R5:
          - CM-1
          - CM-2
          - CM-6
          - CM-7
          - IA-5
    {{ end }}
{{ end }}
