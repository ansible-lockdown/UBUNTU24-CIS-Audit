---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_3_3_1_16 }}
    kernel-param:
      net.ipv4.conf.all.log_martians:
        title: 3.3.1.16 | Ensure net.ipv4.conf.all.log_martians is configured
        value: '1'
        meta:
          server: 1
          workstation: 1
          CIS_ID:
          - 3.3.1.16
          NIST800-53R5:
          - CM-1
          - CM-2
          - CM-6
          - CM-7
          - IA-5
    command:
      ipv4_all_martians:
        title: 3.3.1.16 | Ensure net.ipv4.conf.all.log_martians is configured | conf
        exec: grep "net\.ipv4\.conf\.all\.log_martians" /etc/sysctl.conf /etc/sysctl.d/*
        exit-status:
          or:
          - 0
          - 1
        stdout:
        - '/net\.ipv4\.conf\.all\.log_martians\s*=\s*1/'
        meta:
          server: 1
          workstation: 1
          CIS_ID:
          - 3.3.1.16
          NIST800-53R5:
          - CM-1
          - CM-2
          - CM-6
          - CM-7
          - IA-5
    {{ end }}
{{ end }}
