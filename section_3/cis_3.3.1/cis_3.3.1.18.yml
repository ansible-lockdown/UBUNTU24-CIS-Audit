---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_3_3_1_18 }}
    kernel-param:
      net.ipv4.tcp_syncookies:
        title: 3.3.1.18 | Ensure net.ipv4.tcp_syncookies is configured
        value: '1'
        meta:
          server: 1
          workstation: 1
          CIS_ID:
          - 3.3.1.18
          NIST800-53R5:
          - CM-1
          - CM-2
          - CM-6
          - CM-7
          - IA-5
    command:
      ipv4_tcp_syncookies:
        title: 3.3.1.18 | Ensure net.ipv4.tcp_syncookies is configured | conf
        exec: |
          { /usr/lib/systemd/systemd-sysctl --cat-config; f=$(awk -F= '/^\s*IPT_SYSCTL=/{print $2}' /etc/default/ufw 2>/dev/null); [ -f "$f" ] && cat "$f"; } | grep -Pi '^\h*net(\.|/)ipv4(\.|/)tcp_syncookies\h*=' | tail -n 1
        exit-status: 0
        stdout:
        - '/=\s*1\s*$/'
        meta:
          server: 1
          workstation: 1
          CIS_ID:
          - 3.3.1.18
          NIST800-53R5:
          - CM-1
          - CM-2
          - CM-6
          - CM-7
          - IA-5
    {{ end }}
{{ end }}
