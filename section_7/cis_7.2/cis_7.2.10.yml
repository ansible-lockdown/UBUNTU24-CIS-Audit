---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_7_2_10 }}
command:
  bad_dot_files:
    title: 7.2.10 | Ensure local interactive user dot files access is configured | bad dot files
    exec: |
      awk -F: 'NR==FNR {if ($0 ~ /^\// && $0 !~ /\/nologin$/) v[$0]=1; next} ($NF in v) {print $1, $(NF-1)}' /etc/shells /etc/passwd | while read -r u h; do
        [ -d "$h" ] && find "$h" -xdev -type f \( -name '.forward' -o -name '.rhost' -o -name '.rhosts' \) -print
      done
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^\//'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.10
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  dot_file_perms:
    title: 7.2.10 | Ensure local interactive user dot files access is configured | dot files permissions
    exec: |
      awk -F: 'NR==FNR {if ($0 ~ /^\// && $0 !~ /\/nologin$/) v[$0]=1; next} ($NF in v) {print $1, $(NF-1)}' /etc/shells /etc/passwd | while read -r u h; do
        [ -d "$h" ] || continue
        g=$(id -gn "$u")
        find "$h" -xdev -type f -name '.*' ! -name '.bash_history' ! -name '.netrc' \( -perm /0133 -o ! -user "$u" -o ! -group "$g" \) -print
      done
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^\//'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.10
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  dot_file_bash_history:
    title: 7.2.10 | Ensure local interactive user dot files access is configured | bash_history files permissions
    exec: |
      awk -F: 'NR==FNR {if ($0 ~ /^\// && $0 !~ /\/nologin$/) v[$0]=1; next} ($NF in v) {print $1, $(NF-1)}' /etc/shells /etc/passwd | while read -r u h; do
        [ -d "$h" ] || continue
        g=$(id -gn "$u")
        find "$h" -xdev -type f \( -name '.bash_history' -o -name '.netrc' \) \( -perm /0177 -o ! -user "$u" -o ! -group "$g" \) -print
      done
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^\//'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.10
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
