---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_7_1_8 }}
file:
  gshadow-_perms:
    title: 7.1.8 | Ensure access to /etc/gshadow- is configured
    path: /etc/gshadow-
    exists: true
    owner: root
    group:
      or:
      - root
      - shadow
    mode:
      match-regexp: '^0[0246][04]0$'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.8
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
