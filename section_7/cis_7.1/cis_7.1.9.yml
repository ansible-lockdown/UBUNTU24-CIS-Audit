---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_7_1_9 }}
file:
  etc_shells_perms:
    title: 7.1.9 | Ensure access to /etc/shells is configured
    path: /etc/shells
    exists: true
    owner: root
    group: root
    mode:
      match-regexp: '^0[0246][04][04]$'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.9
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
