---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_7_1_10 }}
command:
  etc_security_opasswd_perms:
    title: 7.1.10 | Ensure permissions on /etc/security/opasswd are configured
    exec: |
      for f in /etc/security/opasswd /etc/security/opasswd.old; do
        [ -e "$f" ] || continue
        o=$(stat -Lc '%U:%G' "$f"); m=$(stat -Lc '%a' "$f")
        [ "$o" != "root:root" ] && echo "FAIL: $f is owned by $o"
        [ $(( 0$m & 0177 )) -ne 0 ] && echo "FAIL: $f is mode $m"
      done
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.10
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
