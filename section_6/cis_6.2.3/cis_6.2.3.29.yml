---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_6_2_3_29 }}
command:
  auditd_immutable:
    title: 6.2.3.29 | Ensure the audit configuration is immutable
    exec: grep -Ph -- '^\h*-e\h+2\b' /etc/audit/rules.d/*.rules | tail -1
    exit-status: 0
    stdout:
    - '/^\s*-e\s+2\b/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.29
      NIST800-53R5:
      - AC-3
      - AU-3
      - AU-12
      - MP-2
  {{ end }}
{{ end }}
