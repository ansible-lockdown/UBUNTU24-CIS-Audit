---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_6_2_3_11 }}
command:
  auditd_12_config:
    title: 6.2.3.11 | Ensure events that modify /etc/group information are collected | Config
    exec: grep identity /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '-w /etc/group -p wa -k identity'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.11
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
