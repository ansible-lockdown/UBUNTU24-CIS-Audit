---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_6_2_3_6 }}
command:
  auditd_6_config:
    title: 6.2.3.6 | Ensure events that modify /etc/issue and /etc/issue.net are collected | Config
    exec: grep system-locale /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '-w /etc/issue -p wa -k system-locale'
    - '-w /etc/issue.net -p wa -k system-locale'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.6
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
