---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_6_2_3_7 }}
command:
  auditd_7_config:
    title: 6.2.3.7 | Ensure events that modify /etc/hosts and /etc/hostname are collected | Config
    exec: grep system-locale /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '-w /etc/hosts -p wa -k system-locale'
    - '-w /etc/hostname -p wa -k system-locale'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.7
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
