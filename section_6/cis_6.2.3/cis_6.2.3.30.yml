---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_6_2_3_30 }}
command:
  auditd_config_match:
    title: 6.2.3.30 | Ensure the running and on disk configuration is the same
    exec: augenrules --check
    exit-status: 0
    stdout:
    - '/.*: No change/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.30
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
