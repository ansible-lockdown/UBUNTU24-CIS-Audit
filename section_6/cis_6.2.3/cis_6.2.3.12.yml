---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_6_2_3_12 }}
command:
  auditd_13_config:
    title: 6.2.3.12 | Ensure events that modify /etc/passwd information are collected | Config
    exec: grep identity /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '-w /etc/passwd -p wa -k identity'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.12
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
