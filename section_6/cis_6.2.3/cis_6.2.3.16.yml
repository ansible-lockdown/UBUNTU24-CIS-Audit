---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_6_2_3_16 }}
command:
  auditd_17_config:
    title: 6.2.3.16 | Ensure events that modify /etc/pam.conf and /etc/pam.d/ information are collected | Config
    exec: grep identity /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '-w /etc/pam.conf -p wa -k identity'
    - '-w /etc/pam.d -p wa -k identity'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.16
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
