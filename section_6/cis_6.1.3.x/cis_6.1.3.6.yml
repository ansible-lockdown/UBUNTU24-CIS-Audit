---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_6_1_3_6 }}
    {{ if not .Vars.ubtu24cis_system_is_log_server }}
    {{ if .Vars.ubtu24cis_remote_log_server }}
command:
  remote_syslog:
    title: 6.1.3.6 | Ensure rsyslog is configured to send logs to a remote log host
    exec: grep -hEv '^[[:space:]]*#' /etc/rsyslog.conf /etc/rsyslog.d/*.conf 2>/dev/null | tr '\n' ' '
    exit-status: 0
    stdout:
    - '/action\(type="omfwd"\s+target="{{ .Vars.ubtu24cis_remote_log_server }}"\s+port="{{ .Vars.ubtu24cis_remote_log_port }}"\s+protocol="{{ .Vars.ubtu24cis_remote_log_protocol }}"/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.3.6
      NIST800-53R5:
      - AU-6
    {{ end }}
  {{ end }}
{{ end }}
{{ end }}
