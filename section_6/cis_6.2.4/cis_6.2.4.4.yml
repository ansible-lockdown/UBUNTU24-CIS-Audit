---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_6_2_4_4 }}
command:
  audit_logfile_group_setting:
    title: 6.2.4.4 | Ensure audit log files group owner is configured
    exec: find "$(grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }' | xargs dirname)"  -type f  -group root -o ! -group adm
    exit-status: 0
    stdout:
    - '!/.*/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.4
      NIST800-53R5:
      - AU-3
  audit_logfile_group:
    title: 6.2.4.4 | Ensure audit log files group owner is configured
    exec: for file in `grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'`; do stat -Lc " %n_%G" $file; done
    exit-status: 0
    stdout:
    - '/.*_(adm|root)$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.4
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
