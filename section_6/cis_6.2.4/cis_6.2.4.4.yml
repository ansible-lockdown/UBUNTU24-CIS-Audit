---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_6_2_4_4 }}
{{- if $logdir := or (and (glob "/etc/audit/auditd.conf") (readFile "/etc/audit/auditd.conf" | findStringSubmatch `(?m)^\s*log_file\s*=\s*(?P<dir>\S*)/[^/\s]*\s*$` | get "dir")) "/var/log/audit" }}
file:
  audit_logfile_group_setting:
    title: 6.2.4.4 | Ensure audit log files group owner is configured | log_group setting
    path: /etc/audit/auditd.conf
    exists: true
    contents:
    - '/^\s*log_group\s*=\s*(adm|root)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.4
      NIST800-53R5:
      - AU-3
command:
  audit_logfile_group:
    title: 6.2.4.4 | Ensure audit log files group owner is configured | file group
    exec: find -L "{{ $logdir }}" -maxdepth 1 -type f ! -group root ! -group adm
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.4
      NIST800-53R5:
      - AU-3
{{- end }}
  {{ end }}
{{ end }}
