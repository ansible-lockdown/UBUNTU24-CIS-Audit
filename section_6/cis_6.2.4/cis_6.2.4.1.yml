---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_6_2_4_1 }}
{{- if $logdir := or (and (glob "/etc/audit/auditd.conf") (readFile "/etc/audit/auditd.conf" | findStringSubmatch `(?m)^\s*log_file\s*=\s*(?P<dir>\S*)/[^/\s]*\s*$` | get "dir")) "/etc/audit/auditd.conf-not-found" }}
file:
  audit_logfile_dir_perms:
    title: 6.2.4.1 | Ensure the audit log file directory mode is configured
    path: {{ $logdir }}
    exists: true
    filetype: directory
    mode:
      match-regexp: '^[0-7][0-7][0145]0$'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.1
      NIST800-53R5:
      - AU-3
{{- end }}
  {{ end }}
{{ end }}
