---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_6_2_4_1 }}
command:
  audit_logfile_dir_perms:
    title: 6.2.4.1 | Ensure the audit log file directory mode is configured
    exec: d=$(dirname $(grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }')); [ -d "$d" ] && find "$d" -maxdepth 0 -perm /0027 || echo "missing log directory $d"
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.1
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
