---

{{ if eq .Vars.ubtu24cis_syslog_service "rsyslog" }}
{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_6_1_1_1_3 }}
command:
  forward_journald_conf:
    title: 6.1.1.1.3 | Ensure journald is configured to send logs to rsyslog
    exec: 'systemd-analyze cat-config systemd/journald.conf | grep -Pi -- ''^\h*ForwardToSyslog\h*='' | tail -n 1'
    exit-status: 0
    stdout:
    - '/(?i)^\s*ForwardToSyslog\s*=\s*yes\s*$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.1.1.3
      NIST800-53R5:
      - AC-3
      - AU-2
      - AU-4
      - AU-12
      - MP-2
  {{ end }}
{{ end }}
{{ end }}
