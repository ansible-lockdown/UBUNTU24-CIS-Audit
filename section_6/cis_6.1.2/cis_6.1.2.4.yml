---

{{ if eq .Vars.ubtu24cis_syslog_service "rsyslog" }}
{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_6_1_2_4 }}
command:
  rsyslog_logging_configured:
    title: 6.1.2.4 | Ensure rsyslog logging is configured
    exec: grep -hsEv '^[[:space:]]*(#|$)' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    exit-status: 0
    stdout:
    - '/^\*\.emerg\s+:omusrmsg:\*/'
    - '/^auth,authpriv\.\*\s+-?\/var\/log\/secure/'
    - '/^mail\.\*\s+-\/var\/log\/mail/'
    - '/^mail\.info\s+-\/var\/log\/mail\.info/'
    - '/^mail\.err\s+-?\/var\/log\/mail\.err/'
    - '/^cron\.\*\s+-?\/var\/log\/cron/'
    - '/^\*\.=warning;\*\.=err\s+-\/var\/log\/warn/'
    - '/^\*\.crit\s+-?\/var\/log\/warn/'
    - '/^\*\.\*;mail\.none;news\.none\s+-?\/var\/log\/messages/'
    - '/^local0,local1\.\*\s+-\/var\/log\/localmessages/'
    - '/^local2,local3\.\*\s+-\/var\/log\/localmessages/'
    - '/^local4,local5\.\*\s+-\/var\/log\/localmessages/'
    - '/^local6,local7\.\*\s+-\/var\/log\/localmessages/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.2.4
      NIST800-53R5:
      - AU-2
      - AU-7
      - AU-12
  {{ end }}
{{ end }}
{{ end }}
