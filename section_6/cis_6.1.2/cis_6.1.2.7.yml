---

{{ if eq .Vars.ubtu24cis_syslog_service "rsyslog" }}
{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_6_1_2_7 }}
file:
  rsyslog_logrotate:
    title: 6.1.2.7 | Ensure logrotate is configured
    path: /etc/logrotate.conf
    exists: true
    contents:
    - '/^\s*(daily|weekly|monthly|yearly)\s*$/'
    - '/^\s*rotate\s+\d+/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.2.7
      NIST800-53R5:
      - AU-8
  {{ end }}
{{ end }}
{{ end }}
