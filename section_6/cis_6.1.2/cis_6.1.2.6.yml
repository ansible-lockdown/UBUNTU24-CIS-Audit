---

{{ if eq .Vars.ubtu24cis_syslog_service "rsyslog" }}
{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_6_1_2_6 }}
    {{ if not .Vars.ubtu24cis_system_is_log_server }}
command:
  local_syslog_module:
    title: 6.1.2.6 | Ensure rsyslog is not configured to receive logs from a remote client | module
    exec: grep -Psi -- '^\h*module\(load=\"?imtcp\"?\)|^\h*\$ModLoad\h+imtcp\b' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '!/.*/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.2.6
      NIST800-53R5:
      - AU-2
      - AU-7
      - AU-12
      - CM-6
  local_syslog_input:
    title: 6.1.2.6 | Ensure rsyslog is not configured to receive logs from a remote client | server/port
    exec: grep -Psi -- '^\h*input\(type=\"?imtcp\"?\b|^\h*\$InputTCPServerRun\b' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '!/.*/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.2.6
      NIST800-53R5:
      - AU-2
      - AU-7
      - AU-12
      - CM-6
    {{ end }}
  {{ end }}
{{ end }}
{{ end }}
