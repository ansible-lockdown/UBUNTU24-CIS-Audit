---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_6_2_2_4 }}
command:
  auditd_space_actions:
    title: 6.2.2.4 | Ensure system warns when audit logs are low on space
    exec: grep -E "action" /etc/audit/auditd.conf
    exit-status: 0
    stdout:
    - '/^\s*space_left_action\s*=\s*{{ .Vars.ubtu24cis_auditd_space_left_action }}\b/'
    - '/(?i)^\s*space_left_action\s*=\s*(email|exec|single|halt)\b/'
    - '/^\s*admin_space_left_action\s*=\s*{{ .Vars.ubtu24cis_auditd_admin_space_left_action }}\b/'
    - '/(?i)^\s*admin_space_left_action\s*=\s*(single|halt)\b/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.2.4
      NIST800-53R5:
      - AU-2
      - AU-8
      - AU-12
      - SI-5
  {{ end }}
{{ end }}
