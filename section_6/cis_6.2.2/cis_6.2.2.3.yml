---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_6_2_2_3 }}
file:
  auditd_space_actions:
    title: 6.2.2.3 | Ensure system is disabled when audit logs are full
    path: /etc/audit/auditd.conf
    exists: true
    contents:
    - '/(?i)^\s*disk_full_action\s*=\s*(halt|single)\b/'
    - '/(?i)^\s*disk_error_action\s*=\s*(syslog|single|halt)\b/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.2.3
      NIST800-53R5:
      - AU-2
      - AU-8
      - AU-12
      - SI-5
  {{ end }}
{{ end }}
