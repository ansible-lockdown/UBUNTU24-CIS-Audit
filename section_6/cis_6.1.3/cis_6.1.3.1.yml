---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_6_1_3_1 }}
command:
  logfile_configured:
    title: 6.1.3.1 | Ensure access to all logfiles has been configured
    exec: |
      find -L /var/log -type f \( \
        \( -path '/var/log/apt/*' -perm /0133 \) -o \
        \( ! -path '/var/log/apt/*' \( -name lastlog -o -name 'lastlog.*' -o -name wtmp -o -name 'wtmp.*' -o -name 'wtmp-*' -o -name btmp -o -name 'btmp.*' -o -name 'btmp-*' -o -name README \) -perm /0113 \) -o \
        \( ! -path '/var/log/apt/*' \( -name 'cloud-init.log*' -o -name 'localmessages*' -o -name 'waagent.log*' \) -perm /0133 \) -o \
        \( ! -path '/var/log/apt/*' \( -name SSSD -o -name sssd -o -name gdm -o -name gdm3 \) -perm /0117 \) -o \
        \( ! -path '/var/log/apt/*' ! \( -name lastlog -o -name 'lastlog.*' -o -name wtmp -o -name 'wtmp.*' -o -name 'wtmp-*' -o -name btmp -o -name 'btmp.*' -o -name 'btmp-*' -o -name README -o -name 'cloud-init.log*' -o -name 'localmessages*' -o -name 'waagent.log*' -o -name SSSD -o -name sssd -o -name gdm -o -name gdm3 \) -perm /0137 \) \
        \) -exec ls -l {} +
    exit-status: 0
    stdout: ['!/./']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.3.1
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
