---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_config_aide }}
    {{ if .Vars.ubtu24cis_rule_6_3_2 }}
command:
  dailyaidecheck_service:
    title: 6.3.2 | Ensure filesystem integrity is regularly checked | aidecheck service static or enabled
    exec: systemctl is-enabled dailyaidecheck.service
    exit-status: 0
    stdout:
    - '/^(static|enabled)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.3.2
      NIST800-53R5: NA
service:
  dailyaidecheck.timer:
    title: 6.3.2 | Ensure filesystem integrity is regularly checked | aidecheck timer enabled and active
    enabled: true
    running: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.3.2
      NIST800-53R5: NA
    {{ end }}
  {{ end }}
{{ end }}
