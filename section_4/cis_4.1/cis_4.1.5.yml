---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_4_1_5 }}
command:
  ufw_routed_default:
    title: 4.1.5 | Ensure ufw routed default is configured
    exec: 'ufw status verbose | grep Default:'
    exit-status: 0
    stdout:
    - '/deny \(routed\)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.1.5
      NIST800-53R5:
      - SC-7
  {{ end }}
{{ end }}
