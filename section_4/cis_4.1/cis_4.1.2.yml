---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_4_1_2 }}
service:
  ufw:
    title: 4.1.2 | Ensure ufw service is configured
    running: true
    enabled: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.1.2
      NIST800-53R5:
      - SC-7
command:
  ufw_status_active:
    title: 4.1.2 | Ensure ufw service is configured | ufw status
    exec: ufw status
    exit-status: 0
    stdout:
    - '/^Status: active/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.1.2
      NIST800-53R5:
      - SC-7
  {{ end }}
{{ end }}
