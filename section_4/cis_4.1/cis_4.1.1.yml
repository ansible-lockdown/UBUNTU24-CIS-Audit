---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_4_1_1 }}
command:
  single_firewall_utility:
    title: 4.1.1 | Ensure a single firewall configuration utility is in use
    exec: |
      active=0
      for fw in ufw nftables iptables; do
        cmd=$fw; [ "$fw" = nftables ] && cmd=nft
        command -v $cmd >/dev/null 2>&1 && systemctl is-enabled --quiet $fw 2>/dev/null && systemctl is-active --quiet $fw 2>/dev/null && active=$((active+1))
      done
      if [ "$active" -eq 1 ]; then echo "PASS: $active firewall utility active"; else echo "FAIL: $active firewall utilities active"; fi
    exit-status: 0
    stdout:
    - 'PASS'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.1.1
      NIST800-53R5:
      - CA-9
      - SC-7
  {{ end }}
{{ end }}
