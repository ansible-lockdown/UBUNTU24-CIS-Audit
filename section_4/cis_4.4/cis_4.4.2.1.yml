---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_4_4_2_1 }}
command:
  ipt_def_deny:
    title: 4.4.2.1 | Ensure iptables default deny firewall policy
    exec: |
      out=$(iptables -L -n 2>&1) || { echo "FAIL: iptables -L failed"; exit 0; }
      fail=0
      for c in INPUT FORWARD OUTPUT; do
        printf '%s\n' "$out" | grep -Eq "^Chain $c \(policy (DROP|REJECT)" || { echo "FAIL: $c chain policy is not DROP or REJECT"; fail=1; }
      done
      if [ "$fail" -eq 0 ]; then echo "PASS"; fi
    exit-status: 0
    stdout:
    - '/^PASS/'
    - '!/FAIL/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.4.2.1
      NIST800-53R5:
      - CA-9
      - SC-7
  {{ end }}
{{ end }}
