    title: 4.4.3.3 | Ensure ip6tables outbound and established connections are configured | Manual
    exec: echo "Manual - Please confirm ip6tables outbound and connections are configured and matched site policy"
    exit-status: 0
    stdout:
    - '!/^Manual/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.4.3.3
      NIST800-53R5:
      - CA-9
      - SC-7
  {{ end }}
{{ end }}
