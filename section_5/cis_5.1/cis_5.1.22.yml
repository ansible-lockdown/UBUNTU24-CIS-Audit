---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_1_22 }}
command:
  ssh_usepam:
    title: 5.1.22 | Ensure sshd UsePAM is enabled
    exec: sshd -T 2>/dev/null | grep -Ei '^(usepam) '
    exit-status: 0
    stdout:
    - '/^usepam yes$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.22
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
