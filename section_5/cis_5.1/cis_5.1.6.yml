---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_1_6 }}
command:
  sshd_ciphers:
    title: 5.1.6 | Ensure sshd Ciphers are configured
    exec: |
      out=$(sshd -T 2>&1) || { echo "FAIL: sshd -T failed"; exit 2; }
      printf '%s\n' "$out" | grep -Pi -- '^ciphers\h+\"?([^#\n\r]+,)?((3des|blowfish|cast128|aes(128|192|256))-cbc|arcfour(128|256)?|rijndael-cbc@lysator\.liu\.se)\b'
    exit-status:
      or:
      - 0
      - 1
    stdout:
      - '!/.*/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.6
      NIST800-53R5:
      - SC-8
  {{ end }}
{{ end }}
