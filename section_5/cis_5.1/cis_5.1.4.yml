---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_1_4 }}
command:
  sshd_access_limited:
    title: 5.1.4 | Ensure sshd access is configured
    exec: |
      out=$(sshd -T 2>&1) || { echo "FAIL: sshd -T failed"; exit 2; }
      printf '%s\n' "$out" | grep -Pi -- '^\h*(allow|deny)(users|groups)\h+\H+'
    exit-status: 0
    stdout:
    - '/^(?i)(allow|deny)(users|groups)\s+\S+/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.4
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
