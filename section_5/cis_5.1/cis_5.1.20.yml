---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_1_20 }}
command:
  ssh_permit_root:
    title: 5.1.20 | Ensure sshd PermitRootLogin is disabled
    exec: sshd -T 2>/dev/null | grep -Ei '^(permitrootlogin) '
    exit-status: 0
    stdout:
    - '/^permitrootlogin no$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.20
      NIST800-53R5:
      - AC-6
  {{ end }}
{{ end }}
