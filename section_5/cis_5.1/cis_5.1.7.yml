---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_1_7 }}
command:
  sshd_clientalive:
    title: 5.1.7 | Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured
    exec: sshd -T 2>/dev/null | grep -Ei '^(clientaliveinterval|clientalivecountmax) '
    exit-status: 0
    stdout:
    - '/^clientaliveinterval {{ .Vars.ubtu24cis_sshd_client_alive_interval }}$/'
    - '/^clientalivecountmax {{ .Vars.ubtu24cis_sshd_client_alive_count_max }}$/'
    - '/^clientaliveinterval [1-9][0-9]*$/'
    - '/^clientalivecountmax [1-9][0-9]*$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.7
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
