---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_1_2 }}
command:
  /etc/ssh/ssh_host_prv_key_user:
    title: 5.1.2 | Ensure access to SSH private host key files is configured | user
    exec: find /etc/ssh/ -name '*_key' -type f ! -user root
    exit-status: 0
    stdout: ['!/./']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.2
      NIST800-53R5:
      - AC-3
      - MP-2
  /etc/ssh/ssh_host_prv_key_group:
    title: 5.1.2 | Ensure access to SSH private host key files is configured | group
    exec: find /etc/ssh/ -name '*_key' -type f ! -group root
    exit-status: 0
    stdout: ['!/./']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.2
      NIST800-53R5:
      - AC-3
      - MP-2
  /etc/ssh/ssh_host_prv_key_perms:
    title: 5.1.2 | Ensure access to SSH private host key files is configured | perms
    exec: find /etc/ssh/ -name '*_key' -type f \( -perm /137 -o \( -group root -perm /177 \) \)
    exit-status: 0
    stdout: ['!/./']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.2
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
