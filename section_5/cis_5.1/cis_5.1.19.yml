---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_1_19 }}
command:
  ssh_empty_passwd:
    title: 5.1.19 | Ensure sshd PermitEmptyPasswords is disabled
    exec: sshd -T 2>/dev/null | grep -Ei '^(permitemptypasswords) '
    exit-status: 0
    stdout:
    - '/^permitemptypasswords no$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.19
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
