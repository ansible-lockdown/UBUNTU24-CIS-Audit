---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_1_21 }}
command:
  ssh_userenv:
    title: 5.1.21 | Ensure sshd PermitUserEnvironment is disabled
    exec: sshd -T 2>/dev/null | grep -Ei '^(permituserenvironment) '
    exit-status: 0
    stdout:
    - '/^permituserenvironment no$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.21
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
