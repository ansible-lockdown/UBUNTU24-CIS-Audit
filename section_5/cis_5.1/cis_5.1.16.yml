---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_1_16 }}
file:
  sshd_authtries:
    title: 5.1.16 | Ensure sshd MaxAuthTries is configured
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - '/^(?i)MaxAuthTries [1-4]\s*$/'
    - '!/^(?i)MaxAuthTries ([5-9]|[1-9][0-9]+)\s*$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.16
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
