---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_1_16 }}
command:
  sshd_authtries:
    title: 5.1.16 | Ensure sshd MaxAuthTries is configured
    exec: sshd -T 2>/dev/null | grep -Ei '^(maxauthtries) '
    exit-status: 0
    stdout:
    - '/^maxauthtries [1-4]$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.16
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
