---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_1_11 }}
command:
  ssh_rhosts:
    title: 5.1.11 | Ensure sshd IgnoreRhosts is enabled
    exec: sshd -T 2>/dev/null | grep -Ei '^(ignorerhosts) '
    exit-status: 0
    stdout:
    - '/^ignorerhosts yes$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.11
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
