---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_5_1_9 }}
command:
  sshd_gssapiauth:
    title: 5.1.9 | Ensure sshd GSSAPIAuthentication is disabled
    exec: sshd -T 2>/dev/null | grep -Ei '^(gssapiauthentication) '
    exit-status: 0
    stdout:
    - '/^gssapiauthentication no$/'
    meta:
      server: 2
      workstation: 1
      CIS_ID:
      - 5.1.9
      NIST800-53R5:
      - CM-7
  {{ end }}
{{ end }}
