---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_5_1_8 }}
command:
  sshd_disableforwarding:
    title: 5.1.8 | Ensure sshd DisableForwarding is enabled
    exec: sshd -T 2>/dev/null | grep -Ei '^(disableforwarding) '
    exit-status: 0
    stdout:
    - '/^disableforwarding yes$/'
    meta:
      server: 2
      workstation: 1
      CIS_ID:
      - 5.1.8
      NIST800-53R5:
      - CM-7
  {{ end }}
{{ end }}
