---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_1_17 }}
command:
  ssh_maxsessions:
    title: 5.1.17 | Ensure sshd MaxSessions is configured
    exec: |
      sshd -T 2>/dev/null | grep -Ei '^(maxsessions) '
      grep -Psi -- '^\h*MaxSessions\h+\"?(1[1-9]|[2-9][0-9]|[1-9][0-9][0-9]+)\b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf | sed 's/^/FAIL: /'
    exit-status: 0
    stdout:
    - '/^maxsessions ([1-9]|10)$/'
    - '!/^FAIL: /'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.17
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
