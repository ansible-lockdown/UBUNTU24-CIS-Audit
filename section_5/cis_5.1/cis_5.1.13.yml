---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_1_13 }}
command:
  ssh_logingrace:
    title: 5.1.13 | Ensure sshd LoginGraceTime is configured
    exec: sshd -T 2>/dev/null | grep -Ei '^(logingracetime) '
    exit-status: 0
    stdout:
    - '/^logingracetime ([1-9]|[1-5][0-9]|60)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.13
      NIST800-53R5:
      - CM-6
  {{ end }}
{{ end }}
