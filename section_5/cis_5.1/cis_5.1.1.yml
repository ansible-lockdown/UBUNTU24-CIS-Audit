---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_1_1 }}
file:
  sshd_config_perms:
    title: 5.1.1 | Ensure permissions on /etc/ssh/sshd_config are configured
    path: /etc/ssh/sshd_config
    exists: true
    mode:
      or:
      - '0600'
      - '0400'
      - '0200'
      - '0000'
    owner: root
    group: root
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.1
      NIST800-53R5:
      - AC-3
      - MP-2
command:
  sshd_config_d_perms:
    title: 5.1.1 | Ensure permissions on /etc/ssh/sshd_config are configured | sshd_config.d conf files
    exec: find /etc/ssh/sshd_config.d/ -xdev -type f -name '*.conf' \( -perm /177 -o ! -user root -o ! -group root \) 2>/dev/null
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.1
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
