---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_1_5 }}
command:
  ssh_banner:
    title: 5.1.5 | Ensure sshd Banner is configured | sshd_default
    exec: sshd -T 2>/dev/null | grep -Ei '^(banner) '
    exit-status: 0
    stdout:
    - '/^banner {{ .Vars.ubtu24cis_sshd_banner_file }}$/'
    - '!/^banner\s+none$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.5
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  ssh_configd_banner:
    title: 5.1.5 | Ensure sshd Banner is configured | conf.d banner settings
    exec: grep -Eis '^\s*Banner\s+"?none\b' /etc/ssh/sshd_config.d/*.conf
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '!/.*/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.5
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
