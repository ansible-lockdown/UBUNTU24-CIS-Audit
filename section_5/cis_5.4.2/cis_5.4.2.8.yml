---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_4_2_8 }}
  command:
    test_valid_shells:
      title: 5.4.2.8 | Ensure accounts without a valid login shell are locked
      skip: {{ not .Vars.ubtu24cis_disruption_high }}
      exec: |
        bash -c 'valid=$(awk -F/ "\$NF != \"nologin\" && /^\// {print}" /etc/shells)
        awk -F: "\$1 != \"root\" {print \$1, \$NF}" /etc/passwd | while read -r u s; do
          printf "%s\n" "$valid" | grep -qxF -- "$s" && continue
          passwd -S "$u" | awk "\$2 !~ /^L/ {print \"Account: \" \$1 \" does not have a valid login shell and is not locked\"}"
        done'
      exit-status: 0
      stdout:
      - '!/./'
      meta:
        server: 1
        workstation: 1
        CIS_ID:
        - 5.4.2.8
        NIST800-53R5:
        - AC-2(5)
        - AC-3
        - AC-11
        - MP-2
  {{ end }}
{{ end }}
