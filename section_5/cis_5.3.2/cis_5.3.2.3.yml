---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_3_2_3 }}
file:
  pam_pwquality_enabled_common_passwd:
    title: 5.3.2.3 | Ensure pam_pwquality module is enabled
    skip: {{ not .Vars.ubtu24cis_disruption_high }}
    skip-reason: ubtu24cis_disruption_high is false, the role does not change the PAM configuration
    path: /etc/pam.d/common-password
    exists: true
    contents:
    - '/^\s*password\s+(required|requisite)\s+pam_pwquality.so/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.3
      NIST800-53R5: NA
  {{ end }}
{{ end }}
