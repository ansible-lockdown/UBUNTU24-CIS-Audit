---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_3_1_2 }}
package:
  libpam-modules:
    title: 5.3.1.2 | Ensure latest version of libpam-modules is installed
    installed: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.1.2
      NIST800-53R5: NA
command:
  libpam_modules_upgradable:
    title: 5.3.1.2 | Ensure latest version of libpam-modules is installed | latest version
    exec: apt list --upgradable 2>/dev/null | grep -P '^libpam-modules\b'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.1.2
      NIST800-53R5: NA
  {{ end }}
{{ end }}
