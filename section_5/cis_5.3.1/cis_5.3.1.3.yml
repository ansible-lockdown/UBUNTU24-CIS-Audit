    title: 5.3.1.3 | Ensure latest version of libpam-pwquality is installed
    installed: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.1.3
      NIST800-53R5: NA
command:
  libpam_pwquality_upgradable:
    title: 5.3.1.3 | Ensure latest version of libpam-pwquality is installed | latest version
    exec: apt list --upgradable 2>/dev/null | grep -P '^libpam-pwquality\b'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.1.3
      NIST800-53R5: NA
  {{ end }}
{{ end }}
