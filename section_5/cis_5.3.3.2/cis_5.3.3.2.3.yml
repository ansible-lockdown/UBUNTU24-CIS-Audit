---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_3_3_2_3 }}
command:
  password_complex:
    title: 5.3.3.2.3 | Ensure password complexity is configured
    exec: grep -Psi -- '^\h*(minclass|[dulo]credit)\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/.*\:minclass\s*=\s*([1-9]|[1-9][0-9])/'
    - '/.*\:ucredit\s*=\s*(0|-\d)/'
    - '/.*\:lcredit\s*=\s*(0|-\d)/'
    - '/.*\:dcredit\s*=\s*(0|-\d)/'
    - '/.*\:ocredit\s*=\s*(0|-\d)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.2.3
      NIST800-53R5: IA-5
file:
  password_complex_not_pamd:
    title: 5.3.3.2.3 | Ensure password complexity is configured
    path: /etc/pam.d/common-password
    exists: true
    contents:
    - '!/(?i)^\s*password\s+(requisite|required|sufficient)\s+pam_pwquality\.so\s+([^#\n\r]+\s+)?(minclass=\d*|[dulo]credit=-?\d*)\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.2.3
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
