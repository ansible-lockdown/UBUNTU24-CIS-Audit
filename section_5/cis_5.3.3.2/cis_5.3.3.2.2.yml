---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_3_3_2_2 }}
command:
  password_minlen:
    title: 5.3.3.2.2 | Ensure password length is configured
    exec: grep -Psi -- '^\h*minlen\h*=\h*(1[4-9]|[2-9][0-9]|[1-9][0-9]{2,})\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/:\s*minlen\s*=\s*(1[4-9]|[2-9][0-9]|[1-9][0-9]{2,})\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.2.2
      NIST800-53R5: IA-5
file:
  password_minlen_not_pamd:
    title: 5.3.3.2.2 | Ensure password length is configured
    path: /etc/pam.d/common-password
    exists: true
    contents:
    - '!/(?i)^\s*password\s+(requisite|required|sufficient)\s+pam_pwquality\.so\s+([^#\n\r]+\s+)?minlen\s*=\s*([0-9]|1[0-3])\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.2.2
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
