---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_2_7 }}
file:
  su_conf:
    title: 5.2.7 | Ensure access to the su command is restricted
    path: /etc/pam.d/su
    exists: true
    contents:
    - '/^auth\s+required\s+pam_wheel.so use_uid group={{ .Vars.ubtu24cis_sugroup }}/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.2.7
      NIST800-53R5:
      - AC-6
  sugroup_etc_group:
    title: 5.2.7 | Ensure access to the su command is restricted
    path: /etc/group
    exists: true
    contents:
    - '/^{{ .Vars.ubtu24cis_sugroup }}:[^:]*:[0-9]+:$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.2.7
      NIST800-53R5:
      - AC-6
  {{ end }}
{{ end }}
