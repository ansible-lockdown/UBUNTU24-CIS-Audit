---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_5_2_2 }}
file:
  sudoers_use_pty:
    title: 5.2.2 | Ensure sudo commands use pty | Config
    path: /etc/sudoers
    exists: true
    contents:
    - '/^Defaults.*\suse_pty/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.2.2
      NIST800-53R5:
      - AC-6
command:
  pty_sudoers_d:
    title: 5.2.2 | Ensure sudo commands use pty | !use_pty not set
    exec: grep -rPi -- '^\h*Defaults\h+([^#\n\r]+,\h*)?!use_pty\b' /etc/sudoers /etc/sudoers.d/
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.2.2
      NIST800-53R5:
      - AC-6
  {{ end }}
{{ end }}
