---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_1_2_1_3 }}
command:
  apt_gpg_key_perms:
    title: 1.2.1.3 | Ensure access to gpg key files are configured
    exit-status: 0
    exec: |
      find -L /usr/share/keyrings/ /etc/apt/trusted.gpg.d/ -mount -xdev -type f \( ! -user root -o ! -group root -o -perm /133 \) -name '*gpg' 2>/dev/null
      find -L /etc/apt/sources.list.d/ -mount -xdev -type f \( ! -user root -o ! -group root -o -perm /133 \) \( -name '*.list' -o -name '*.sources' \) -exec grep -PiLs -- '^([^#\n\r]+)?\bSigned-By\b' {} + 2>/dev/null
      true
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.2.1.3
      NIST800-53R5: AC-6
  {{ end }}
{{ end }}
