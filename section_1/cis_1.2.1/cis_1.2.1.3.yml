---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_1_2_1_3 }}
command:
  apt_gpg_key_perms:
    title: 1.2.1.3 | Ensure access to gpg key files are configured
    exit-status: 0
    exec: find /etc/apt/trusted.gpg.d /usr/share/keyrings -type f \( -name "*.gpg" -o -name "*.asc" \) 2>/dev/null | xargs -r stat -c '%U:%G:%a:%n' | grep -Pv -- '^root:root:0[0-6]{2}:' ; true
    stdout:
    - '/^$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.2.1.3
      NIST800-53R5: AC-6
  {{ end }}
{{ end }}
