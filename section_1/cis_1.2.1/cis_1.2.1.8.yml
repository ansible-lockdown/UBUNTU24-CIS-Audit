---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_1_2_1_8 }}
file:
  apt_sources_list_d:
    title: 1.2.1.8 | Ensure access to /etc/apt/sources.list.d directory is configured
    path: /etc/apt/sources.list.d
    exists: true
    filetype: directory
    owner: root
    group: root
    mode:
      match-regexp: '^0[0-7][0145][0145]$'
    meta:
      server: 1
      workstation: 2
      CIS_ID: 1.2.1.8
      NIST800-53R5: AC-6
  {{ end }}
{{ end }}
