---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_1_2_1_1 }}
command:
  apt_signed_by:
    title: 1.2.1.1 | Ensure the source.list and .source files use the Signed-By option
    exit-status: 0
    exec: |
      for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
        [ -f "$f" ] || continue
        grep -Pqs -- '^\h*(deb|deb-src|Types:)\b' "$f" || continue
        grep -PiLs -- '^([^#\n\r]+)?\bSigned-By\b' "$f"
      done
      true
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.2.1.1
      NIST800-53R5: SI-2
  {{ end }}
{{ end }}
