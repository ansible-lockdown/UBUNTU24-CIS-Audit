---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_1_3_1_4 }}
kernel-param:
  kernel.apparmor_restrict_unprivileged_unconfined:
    title: 1.3.1.4 | Ensure apparmor_restrict_unprivileged_unconfined is enabled
    value: '1'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.3.1.4
      NIST800-53R5: AC-3
command:
  apparmor_restrict_unconfined_conf:
    title: 1.3.1.4 | Ensure apparmor_restrict_unprivileged_unconfined is enabled | conf
    exec: |
      { /usr/lib/systemd/systemd-sysctl --cat-config; f=$(awk -F= '/^\s*IPT_SYSCTL=/{print $2}' /etc/default/ufw 2>/dev/null); [ -f "$f" ] && cat "$f"; } | grep -Pi '^\h*kernel(\.|/)apparmor_restrict_unprivileged_unconfined\h*=' | tail -n 1
    exit-status: 0
    stdout:
    - '/=\s*1\s*$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.3.1.4
      NIST800-53R5: AC-3
  {{ end }}
{{ end }}
