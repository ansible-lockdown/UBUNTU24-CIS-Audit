---

{{ if .Vars.ubtu24cis_level_2 }}
{{ if not .Vars.ubtu24cis_apparmor_disable }}
  {{ if .Vars.ubtu24cis_rule_1_3_1_3 }}
command:
  apparmor_enf_only:
    title: 1.3.1.3 | Ensure all AppArmor Profiles are enforcing
    exec: apparmor_status 2>/dev/null | grep -E '^[0-9]+ (profiles are loaded|profiles are in complain mode|processes are unconfined but have a profile defined)\.'
    exit-status: 0
    stdout:
    - '/^[1-9][0-9]* profiles are loaded\./'
    - '/^0 profiles are in complain mode\./'
    - '/^0 processes are unconfined but have a profile defined\./'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.3.1.3
      NIST800-53R5: AC-3
  {{ end }}
  {{ end }}
{{ end }}
