---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_1_6_9 }}
command:
  pam_motd_perms:
    title: 1.6.9 | Ensure access to pam_motd file is configured
    exec: |
      grep -hPo 'motd=\K\S+' /etc/pam.d/* 2>/dev/null | tr -d "\"'" | sort -u | while IFS= read -r f; do
        [ -e "$f" ] && find -L "$f" -maxdepth 0 \( ! -user root -o ! -group root -o -perm /0133 \)
      done
      true
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.6.9
      NIST800-53R5:
      - CM-6
      - CM-1
      - CM-3
  {{ end }}
{{ end }}
