---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_1_6_6 }}
command:
  etc_motd_perms:
    title: 1.6.6 | Ensure access to /etc/motd is configured
    exec: find -L /etc/motd /run/motd /usr/lib/motd /etc/motd.d /run/motd.d /usr/lib/motd.d -maxdepth 1 -type f \( ! -user root -o ! -group root -o -perm /0133 \) 2>/dev/null; true
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.6
      NIST800-53R5:
      - CM-6
      - CM-1
      - CM-3
  {{ end }}
{{ end }}
