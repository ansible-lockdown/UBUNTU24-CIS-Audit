---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_1_6_4 }}
command:
  motd_permissions:
    title: 1.6.4 | Ensure access to /etc/motd is configured
    exec: find -L /etc/motd -maxdepth 0 \( ! -user root -o ! -group root -o -perm /0133 \) 2>/dev/null; true
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.4
      NIST800-53R5:
      - CM-6
      - CM-1
      - CM-3
  {{ end }}
{{ end }}
