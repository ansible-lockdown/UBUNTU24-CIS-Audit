---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_1_6_5 }}
command:
  etc_issue_perms:
    title: 1.6.5 | Ensure access to /etc/issue is configured
    exec: stat -Lc '%#a %U %G' /etc/issue
    exit-status: 0
    stdout:
    - '/^0[0246][04][04] root root$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.5
      NIST800-53R5:
      - CM-6
      - CM-1
      - CM-3
  {{ end }}
{{ end }}
