---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_desktop_required }}
    {{ if .Vars.ubtu24cis_rule_1_7_3 }}
command:
  gdm_profile_1_7_3:
    title: 1.7.3 | Ensure GDM disable-user-list option is enabled | dconf profile
    exec: grep -Ps '^\h*(user-db|system-db|file-db):' /etc/dconf/profile/gdm
    exit-status: 0
    stdout:
    - '/^user-db:user$/'
    - '/^system-db:gdm$/'
    - '/^file-db:\/usr\/share\/gdm\/greeter-dconf-defaults$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.3
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  gdm_disable_user:
    title: 1.7.3 | Ensure GDM disable-user-list option is enabled | disable-user-list setting
    exec: cat /etc/dconf/db/gdm.d/* 2>/dev/null | grep -E '^\s*disable-user-list\s*='
    exit-status: 0
    stdout:
    - '/^disable-user-list=true$/'
    - '!/^\s*disable-user-list\s*=\s*false/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.3
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
    {{ end }}
  {{ end }}
{{ end }}
