---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_desktop_required }}
    {{ if .Vars.ubtu24cis_rule_1_7_2 }}
command:
  gdm_profile_1_7_2:
    title: 1.7.2 | Ensure GDM login banner is configured | dconf profile
    exec: grep -Ps '^\h*(user-db|system-db|file-db):' /etc/dconf/profile/gdm
    exit-status: 0
    stdout:
    - '/^user-db:user$/'
    - '/^system-db:gdm$/'
    - '/^file-db:\/usr\/share\/gdm\/greeter-dconf-defaults$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.2
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  gdm_banner:
    title: 1.7.2 | Ensure GDM login banner is configured | banner settings
    exec: cat /etc/dconf/db/gdm.d/* 2>/dev/null | grep -E '^\s*banner-message-(enable|text)\s*='
    exit-status: 0
    stdout:
    - '/^banner-message-enable=true$/'
    - '!/^\s*banner-message-enable\s*=\s*false/'
    - '/^banner-message-text=''.+''$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.2
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
    {{ end }}
  {{ end }}
{{ end }}
