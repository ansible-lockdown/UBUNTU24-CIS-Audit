---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_desktop_required }}
    {{ if .Vars.ubtu24cis_rule_1_7_4 }}
file:
  gnome_automount_disable:
    title: 1.7.4 | Ensure GDM automount is configured
    path: /etc/dconf/db/{{ .Vars.ubtu24cis_dconf_db_name }}.d/00-media-automount
    exists: true
    contents:
    - '/^\[org\/gnome\/desktop\/media-handling\]/'
    - '/^automount=false/'
    - '/^automount-open=false/'
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 1.7.4
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  gnome_automount_locks:
    title: 1.7.4 | Ensure GDM automount is configured | locked
    path: /etc/dconf/db/{{ .Vars.ubtu24cis_dconf_db_name }}.d/locks/00-automount_lock
    exists: true
    contents:
    - '/^\/org\/gnome\/desktop\/media-handling\/automount$/'
    - '/^\/org\/gnome\/desktop\/media-handling\/automount-open$/'
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 1.7.4
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
    {{ end }}
  {{ end }}
{{ end }}
