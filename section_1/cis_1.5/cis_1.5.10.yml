---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_1_5_10 }}
command:
  core_file_size_limits:
    title: 1.5.10 | Ensure core file size is configured | security/limits.conf
    exit-status:
      or:
      - 0
      - 2
    exec: 'grep -Psi -- "^\h*\*\h+hard\h+core\b" /etc/security/limits.conf /etc/security/limits.d/*'
    stdout:
    - '/^\/etc\/security\/limits\.(conf|d\/[^:]+\.conf):\s*\*\s+hard\s+core\s+0(\s|$)/'
    - '!/:\s*\*\s+hard\s+core\s+([1-9]|0\S|unlimited)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.5.10
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
