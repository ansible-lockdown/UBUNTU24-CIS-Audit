---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_1_5_2 }}
kernel-param:
  kernel.yama.ptrace_scope:
    title: 1.5.2 | Ensure ptrace_scope is restricted | sysctl_live
    value: '{{ .Vars.ubtu24cis_ptrace_value }}'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.2
      NIST800-53R5: CM-6
command:
  ptrace_restrict_2:
    title: 1.5.2 | Ensure ptrace_scope is restricted | sysctl_configured
    exit-status:
      or:
      - 0
      - 2
    exec: 'grep "kernel\.yama\.ptrace_scope" /etc/sysctl.conf /etc/sysctl.d/*'
    stdout:
    - '/^\/etc\/sysctl\.(conf|d\/[^:]+\.conf):kernel\.yama\.ptrace_scope\s*=\s*[1-3]$/'
    - '!/:\s*kernel\.yama\.ptrace_scope\s*=\s*([^1-3\s]|[1-3]\S)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.2
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
