---

{{ if .Vars.ubtu24cis_level_2 }}
  {{ if .Vars.ubtu24cis_rule_1_5_2 }}
kernel-param:
  fs.protected_symlinks:
    title: 1.5.2 | Ensure fs.protected_symlinks is configured | sysctl_live
    value: '1'
    meta:
      server: 2
      workstation: 2
      CIS_ID: 1.5.2
      NIST800-53R5: CM-6
command:
  protected_symlinks_configured:
    title: 1.5.2 | Ensure fs.protected_symlinks is configured | sysctl_configured
    exit-status:
      or:
      - 0
      - 2
    exec: 'grep "^fs\.protected_symlinks" /etc/sysctl.conf /etc/sysctl.d/* | cut -d ":" -f2'
    stdout:
    - '/fs.protected_symlinks\s*=\s*1/'
    meta:
      server: 2
      workstation: 2
      CIS_ID: 1.5.2
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
