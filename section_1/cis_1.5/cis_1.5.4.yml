---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_1_5_4 }}
command:
  suid_dumpable_2:
    title: 1.5.4 | Ensure fs.suid_dumpable is configured | sysctl_configured
    exit-status:
      or:
      - 0
      - 2
    exec: 'grep "fs\.suid_dumpable" /etc/sysctl.conf /etc/sysctl.d/*'
    stdout:
    - '/^\/etc\/sysctl\.(conf|d\/[^:]+\.conf):fs\.suid_dumpable\s*=\s*0$/'
    - '!/:\s*fs\.suid_dumpable\s*=\s*([^0\s]|0\S)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.4
      NIST800-53R5: CM-6
kernel-param:
  fs.suid_dumpable:
    title: 1.5.4 | Ensure fs.suid_dumpable is configured | sysctl_live
    value: '0'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.4
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
