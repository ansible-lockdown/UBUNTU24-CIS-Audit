---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_2_1_7 }}
    {{ if not .Vars.ubtu24cis_dns_mask }}
package:
  dns_pkg:
    title: 2.1.7 | Ensure dns server services are not in use | pkg removed
    skip: {{ .Vars.ubtu24cis_dns_server }}
    skip-reason: the DNS server is required, ubtu24cis_dns_server is true
    name: bind9
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.7
      NIST800-53R5:
      - CM-7
    {{ end }}
    {{ if .Vars.ubtu24cis_dns_mask }}
service:
  dns_service_masked:
    title: 2.1.7 | Ensure dns server services are not in use | masked
    skip: {{ .Vars.ubtu24cis_dns_server }}
    skip-reason: the DNS server is required, ubtu24cis_dns_server is true
    name: named.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.7
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
