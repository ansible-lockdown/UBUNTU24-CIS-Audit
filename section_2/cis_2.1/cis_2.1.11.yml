---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_2_1_11 }}
    {{ if not .Vars.ubtu24cis_message_mask }}
package:
  dovecot_imapd_pkg:
    title: 2.1.11 | Ensure message access server services are not in use | pkg removed
    skip: {{ .Vars.ubtu24cis_message_server }}
