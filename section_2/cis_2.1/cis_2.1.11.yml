    name: dovecot-imapd
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.11
      NIST800-53R5:
      - CM-7
  dovecot_pop3d_pkg:
    title: 2.1.11 | Ensure message access server services are not in use | pkg removed
    skip: {{ .Vars.ubtu24cis_message_server }}
    skip-reason: the IMAP/POP3 server is required, ubtu24cis_message_server is true
    name: dovecot-pop3d
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.11
      NIST800-53R5:
      - CM-7
    {{ end }}
    {{ if .Vars.ubtu24cis_message_mask }}
service:
