---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_2_1_8 }}
    {{ if not .Vars.ubtu24cis_ftp_mask }}
package:
  ftp_pkg:
    title: 2.1.8 | Ensure ftp server services are not in use | pkg removed
    skip: {{ .Vars.ubtu24cis_ftp_server }}
    skip-reason: the FTP server is required, ubtu24cis_ftp_server is true
    name: vsftpd
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.8
      NIST800-53R5:
      - CM-7
    {{ end }}
    {{ if .Vars.ubtu24cis_ftp_mask }}
service:
  ftp_service_masked:
    title: 2.1.8 | Ensure ftp server services are not in use | masked
    skip: {{ .Vars.ubtu24cis_ftp_server }}
    skip-reason: the FTP server is required, ubtu24cis_ftp_server is true
    name: vsftpd.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.8
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
