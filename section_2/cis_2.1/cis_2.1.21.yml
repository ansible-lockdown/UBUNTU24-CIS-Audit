---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_2_1_21 }}
    {{ if not .Vars.ubtu24cis_squid_mask }}
package:
  squid_pkg:
    title: 2.1.21 | Ensure web proxy server services are not in use | pkg removed
    skip: {{ .Vars.ubtu24cis_squid_server }}
    skip-reason: the web proxy server is required, ubtu24cis_squid_server is true
    name: squid
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.21
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
    {{ if .Vars.ubtu24cis_squid_mask }}
service:
  squid_service_masked:
    title: 2.1.21 | Ensure web proxy server services are not in use | masked
    skip: {{ .Vars.ubtu24cis_squid_server }}
    skip-reason: the web proxy server is required, ubtu24cis_squid_server is true
    name: squid.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.21
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
