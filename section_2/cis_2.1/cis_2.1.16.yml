---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_2_1_16 }}
    {{ if not .Vars.ubtu24cis_rsync_mask }}
package:
  rsync_pkg:
    title: 2.1.16 | Ensure rsync services are not in use | pkg removed
    skip: {{ .Vars.ubtu24cis_rsync_server }}
    skip-reason: the rsync service is required, ubtu24cis_rsync_server is true
    name: rsync
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.16
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
    {{ if .Vars.ubtu24cis_rsync_mask }}
service:
  rsync_service_masked:
    title: 2.1.16 | Ensure rsync services are not in use | masked
    skip: {{ .Vars.ubtu24cis_rsync_server }}
    skip-reason: the rsync service is required, ubtu24cis_rsync_server is true
    name: rsync.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.16
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
