---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_2_1_10 }}
    {{ if not .Vars.ubtu24cis_ldap_mask }}
package:
  ldap_pkg:
    title: 2.1.10 | Ensure ldap server services are not in use | pkg removed
    skip: {{ .Vars.ubtu24cis_ldap_server }}
    skip-reason: the LDAP server is required, ubtu24cis_ldap_server is true
    name: slapd
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.10
      NIST800-53R5:
      - CM-7
    {{ end }}
    {{ if .Vars.ubtu24cis_ldap_mask }}
service:
  ldap_service_masked:
    title: 2.1.10 | Ensure ldap server services are not in use | masked
    skip: {{ .Vars.ubtu24cis_ldap_server }}
    skip-reason: the LDAP server is required, ubtu24cis_ldap_server is true
    name: slapd.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.10
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
