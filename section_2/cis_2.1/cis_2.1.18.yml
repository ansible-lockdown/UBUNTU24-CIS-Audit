---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_2_1_18 }}
    {{ if not .Vars.ubtu24cis_snmp_mask }}
package:
  snmp_pkg:
    title: 2.1.18 | Ensure snmp services are not in use | pkg removed
    skip: {{ .Vars.ubtu24cis_snmp_server }}
    skip-reason: the SNMP server is required, ubtu24cis_snmp_server is true
    name: snmpd
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.18
      NIST800-53R5:
      - CM-7
    {{ end }}
    {{ if .Vars.ubtu24cis_snmp_mask }}
service:
  snmp_service_masked:
    title: 2.1.18 | Ensure snmp services are not in use | masked
    skip: {{ .Vars.ubtu24cis_snmp_server }}
    skip-reason: the SNMP server is required, ubtu24cis_snmp_server is true
    name: snmpd.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.18
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
