---

{{ if or (and (eq .Vars.system_type "Server") .Vars.ubtu24cis_level_1) (and (eq .Vars.system_type "Workstation") .Vars.ubtu24cis_level_2) }}
  {{ if .Vars.ubtu24cis_rule_2_1_3 }}
    {{ if not .Vars.ubtu24cis_avahi_mask }}
package:
  avahi_pkg:
    title: 2.1.3 | Ensure avahi daemon services are not in use | pkg removed
    skip: {{ .Vars.ubtu24cis_avahi_server }}
    skip-reason: avahi is required, ubtu24cis_avahi_server is true
    name: avahi-daemon
    installed: false
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 2.1.3
      NIST800-53R5:
      - SI-4
    {{ end }}
    {{ if .Vars.ubtu24cis_avahi_mask }}
service:
  avahi_socket_masked:
    title: 2.1.3 | Ensure avahi daemon services are not in use | masked
    skip: {{ .Vars.ubtu24cis_avahi_server }}
    skip-reason: avahi is required, ubtu24cis_avahi_server is true
    name: avahi-daemon.socket
    masked: true
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 2.1.3
      NIST800-53R5:
      - SI-4
  avahi_service_masked:
    title: 2.1.3 | Ensure avahi daemon services are not in use | masked
    skip: {{ .Vars.ubtu24cis_avahi_server }}
    skip-reason: avahi is required, ubtu24cis_avahi_server is true
    name: avahi-daemon.service
    masked: true
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 2.1.3
      NIST800-53R5:
      - SI-4
    {{ end }}
  {{ end }}
{{ end }}
