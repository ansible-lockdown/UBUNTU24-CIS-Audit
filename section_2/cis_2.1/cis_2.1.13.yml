---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_2_1_13 }}
    {{ if not .Vars.ubtu24cis_nis_mask }}
package:
  ypserv_pkg:
    title: 2.1.13 | Ensure nis server services are not in use | pkg removed
    skip: {{ .Vars.ubtu24cis_nis_server }}
    skip-reason: the NIS server is required, ubtu24cis_nis_server is true
    name: ypserv
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.13
      NIST800-53R5:
      - CM-7
    {{ end }}
    {{ if .Vars.ubtu24cis_nis_mask }}
service:
  ypserv_service_masked:
    title: 2.1.13 | Ensure nis server services are not in use | masked
    skip: {{ .Vars.ubtu24cis_nis_server }}
    skip-reason: the NIS server is required, ubtu24cis_nis_server is true
    name: ypserv.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.13
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
