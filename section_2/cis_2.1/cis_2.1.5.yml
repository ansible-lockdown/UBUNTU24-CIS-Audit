---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_2_1_5 }}
    {{ if not .Vars.ubtu24cis_dhcp_server }}
      {{ if not .Vars.ubtu24cis_dhcp_mask }}
package:
  kea_pkg:
    title: 2.1.5 | Ensure dhcp server services are not in use | pkg removed | kea
    name: kea
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.5
      NIST800-53R5:
      - CM-7
  kea_dhcp4_pkg:
    title: 2.1.5 | Ensure dhcp server services are not in use | pkg removed | kea-dhcp4-server
    name: kea-dhcp4-server
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.5
      NIST800-53R5:
      - CM-7
  kea_dhcp6_pkg:
    title: 2.1.5 | Ensure dhcp server services are not in use | pkg removed | kea-dhcp6-server
    name: kea-dhcp6-server
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.5
      NIST800-53R5:
      - CM-7
  kea_ddns_pkg:
    title: 2.1.5 | Ensure dhcp server services are not in use | pkg removed | kea-dhcp-ddns-server
    name: kea-dhcp-ddns-server
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.5
      NIST800-53R5:
      - CM-7
      {{ end }}
      {{ if .Vars.ubtu24cis_dhcp_mask }}
file:
  kea_dhcp4_masked:
    title: 2.1.5 | Ensure dhcp server services are not in use | masked | kea-dhcp4-server
    path: /etc/systemd/system/kea-dhcp4-server.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.5
      NIST800-53R5:
      - CM-7
  kea_dhcp6_masked:
    title: 2.1.5 | Ensure dhcp server services are not in use | masked | kea-dhcp6-server
    path: /etc/systemd/system/kea-dhcp6-server.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.5
      NIST800-53R5:
      - CM-7
  kea_ddns_masked:
    title: 2.1.5 | Ensure dhcp server services are not in use | masked | kea-dhcp-ddns-server
    path: /etc/systemd/system/kea-dhcp-ddns-server.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.5
      NIST800-53R5:
      - CM-7
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
