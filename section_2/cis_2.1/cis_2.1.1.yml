---

{{ if or (and (eq .Vars.system_type "Server") .Vars.ubtu24cis_level_1) (and (eq .Vars.system_type "Workstation") .Vars.ubtu24cis_level_2) }}
  {{ if .Vars.ubtu24cis_rule_2_1_1 }}
    {{ if not .Vars.ubtu24cis_autofs_mask }}
package:
  autofs_pkg:
    title: 2.1.1 | Ensure autofs services are not in use | pkg removed
    skip: {{ .Vars.ubtu24cis_autofs_services }}
    skip-reason: autofs is required, ubtu24cis_autofs_services is true
    name: autofs
    installed: false
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 2.1.1
      NIST800-53R5:
      - SI-3
      - MP-7
    {{ end }}
    {{ if .Vars.ubtu24cis_autofs_mask }}
service:
  autofs_masked:
    title: 2.1.1 | Ensure autofs services are not in use | masked
    skip: {{ .Vars.ubtu24cis_autofs_services }}
    skip-reason: autofs is required, ubtu24cis_autofs_services is true
    name: autofs.service
    masked: true
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 2.1.1
      NIST800-53R5:
      - SI-3
      - MP-7
    {{ end }}
  {{ end }}
{{ end }}
