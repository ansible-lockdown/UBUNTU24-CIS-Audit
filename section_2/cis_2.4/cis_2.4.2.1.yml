---

{{ if .Vars.ubtu24cis_level_1 }}
  {{ if .Vars.ubtu24cis_rule_2_4_2_1 }}
file:
  at_deny_absent:
    title: 2.4.2.1 | Ensure at is restricted to authorized users
    path: /etc/at.deny
    exists: false
    skip: {{ not .Vars.ubtu24cis_at_installed }}
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.4.2.1
      NIST800-53R5:
      - AC-3
      - MP-2
  /etc/at.allow:
    title: 2.4.2.1 | Ensure at is restricted to authorized users
    exists: true
    skip: {{ not .Vars.ubtu24cis_at_installed }}
    owner: root
    group:
      or:
      - root
      - daemon
    mode:
      or:
      - "0640"
      - "0600"
      - "0400"
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.4.2.1
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
